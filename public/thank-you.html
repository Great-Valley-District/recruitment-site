<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Great Valley District Scouts</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, #f8f7f6, #fffdf0);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      color: #243E2C;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      color: #44403c;
      font-size: 1.125rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background-color: #243E2C;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    a:hover {
      background-color: #1a2e1f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thank You!</h1>
    <p>
      We've received your application and are excited to help your family begin their Scouting journey!
    </p>
    <p>
      A troop coordinator will contact you within 24 hours to answer any questions and help you get started.
    </p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>

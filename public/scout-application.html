<!DOCTYPE html>
<html>
<head>
  <title>Scout Application</title>
</head>
<body>
  <!-- Static form for Netlify to detect at build time -->
  <form name="scout-application" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="scout-application" />
    <input type="text" name="bot-field" />
    <input type="text" name="email" />
    <input type="text" name="phone" />
    <input type="text" name="parentName" />
    <input type="text" name="childName" />
    <input type="text" name="childAge" />
    <input type="text" name="zipCode" />
    <input type="text" name="recommendedProgram" />
    <input type="text" name="meetingAvailability" />
    <input type="text" name="hearAbout" />
    <textarea name="specialNeeds"></textarea>
  </form>
</body>
</html>
